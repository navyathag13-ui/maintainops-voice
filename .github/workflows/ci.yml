name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    # Runs the live-API tests against a real MaintainOps started from its own repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: navyathag13-ui/maintainops
          path: maintainops
      - name: Start MaintainOps
        run: |
          docker compose -f maintainops/docker-compose.yml up -d --build db backend
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          MAINTAINOPS_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maintainops-voice .
