# A local Odoo 17 (Community) with the Maintenance, Inventory and Employees apps:
# the "customer system you don't own" for BACKEND=odoo. Local test instance only.
services:
  odoo-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo_db:/var/lib/postgresql/data
  odoo:
    image: odoo:17.0
    depends_on:
      - odoo-db
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - odoo_data:/var/lib/odoo
volumes:
  odoo_db:
  odoo_data:
